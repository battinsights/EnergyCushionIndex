name: Build index

# Runs weekly on Thursday. The index itself is published monthly, since the
# underlying EIA data is monthly, but checking weekly means new data appears
# as soon as EIA publishes it rather than waiting for a fixed calendar day.
# The commit step is a no-op when nothing has changed, so extra runs are
# harmless.
#
# Actions cron is UTC and best effort, so it can run late. Nothing here
# depends on the exact minute.
on:
  schedule:
    - cron: "30 16 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Build the index
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python build_index.py

      - name: Report what was produced
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/index.json"))
          print("as of      ", d["as_of"])
          print("headline   ", d["headline"]["score"], d["headline"]["band"])
          print("oil        ", d["sub_indices"]["oil"]["score"])
          print("gas        ", d["sub_indices"]["gas"]["score"])
          for k, v in (d.get("component_lags") or {}).items():
              print(f"lag        {k}, {v['months_carried_forward']} months carried forward")
          PY

      - name: Check the data is fresh and complete
        run: |
          python - <<'PY'
          import json, sys
          from datetime import date
          d = json.load(open("data/index.json"))
          problems = []

          failed = d.get("failed_series") or []
          if failed:
              problems.append(f"{len(failed)} series did not return: {failed}")

          # Freshness. Every series can return successfully while EIA has
          # quietly stopped updating one, which would publish an index that
          # looks fine and is increasingly out of date. The headline reports
          # the last completed month, so one month behind is normal, two is
          # tolerable given reporting lags, three means something has stalled.
          y, m, _ = map(int, d["as_of"].split("-"))
          today = date.today()
          months_behind = (today.year - y) * 12 + today.month - m
          if months_behind > 3:
              problems.append(
                  f"headline is {months_behind} months behind, expected 1 to 2")

          if problems:
              for p in problems:
                  print("PROBLEM:", p)
              print("The index was still written, but this run is marked failed "
                    "so the problem is visible rather than silently published.")
              sys.exit(1)
          print(f"data complete, headline {months_behind} month(s) behind, as expected")
          PY

      - name: Commit the new values
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change in the data, nothing to commit."
          else
            AS_OF=$(python -c "import json;print(json.load(open('data/index.json'))['as_of'])")
            SCORE=$(python -c "import json;print(json.load(open('data/index.json'))['headline']['score'])")
            git commit -m "Index ${SCORE} as of ${AS_OF}"
            git push
          fi
